<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Pintu Legal — Legalitas Bisnis yang Lebih Mudah dan Terarah">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2747"/>
      <stop offset="100%" stop-color="#1B3D6A"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#C89B3C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C89B3C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#navy)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>

  <!-- Door icon -->
  <g transform="translate(80, 215)">
    <path d="M20 165 L20 80 Q20 30 70 30 L70 165 Z" fill="#FFFFFF"/>
    <path d="M100 165 L100 80 Q100 30 150 30 L150 165 Z" fill="#FFFFFF"/>
    <circle cx="56" cy="100" r="7" fill="#C89B3C"/>
    <circle cx="114" cy="100" r="7" fill="#C89B3C"/>
    <rect x="14" y="165" width="142" height="10" rx="3" fill="#C89B3C"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-weight="800">
    <text x="260" y="160" font-size="44" letter-spacing="3" fill="#C89B3C">PINTU LEGAL</text>
    <text x="260" y="240" font-size="68" letter-spacing="0" fill="#FFFFFF">Membuka Jalan Menuju</text>
    <text x="260" y="320" font-size="68" letter-spacing="0" fill="#FFFFFF">Bisnis yang <tspan fill="#D8B25C">Legal.</tspan></text>
  </g>

  <!-- Sub headline -->
  <text x="260" y="390" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="26" fill="rgba(255,255,255,0.7)">Jasa legalitas bisnis yang profesional, jelas, dan terarah.</text>

  <!-- CTA pill -->
  <g transform="translate(260, 440)">
    <rect width="280" height="56" rx="14" fill="#C89B3C"/>
    <text x="140" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="22" font-weight="700" fill="#0F2747">Konsultasi Gratis</text>
  </g>

  <!-- Footer brand -->
  <text x="80" y="585" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="18" fill="rgba(255,255,255,0.5)">PT. Pintu Menuju Sukses · pintulegal.id</text>
</svg>
